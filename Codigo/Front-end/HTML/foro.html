<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Foro comunitario de la clase: compartí ideas y resolvé dudas.">
  <title>Foro · Telurio</title>

  <link rel="icon" type="image/png" href="img/logo-telurio.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>

<body class="cuerpo-app">

  <!-- ============================ CABECERA ============================== -->
  <header class="cabecera">
    <button class="boton-menu" id="boton-menu" aria-label="Abrir menú"
            aria-controls="menu-lateral" aria-expanded="false">☰</button>

    <a class="marca-cabecera" href="inicio.html">
      <img src="img/logo-telurio.png" alt="">
      <span>Telurio</span>
    </a>

    <div class="cabecera-derecha">
      <div class="chip-atomos" title="Átomos acumulados">
        <img src="img/logo-telurio.png" alt="">
        <span class="etiqueta-atomos">Átomos acumulados:</span>
        <strong id="valor-atomos">0</strong>
      </div>

      <div class="menu-usuario">
        <button class="boton-usuario" id="boton-usuario"
                aria-label="Menú del usuario" aria-expanded="false">
          <img src="img/usuario-icono.png" alt="">
        </button>
        <div class="desplegable-usuario" id="desplegable-usuario">
          <p class="nombre-usuario">Alumno</p>
          <button type="button" id="boton-cerrar-sesion">Cerrar sesión</button>
        </div>
      </div>
    </div>
  </header>

  <div class="telon-menu" id="telon-menu"></div>

  <!-- ========================== MENÚ LATERAL ============================ -->
  <aside class="menu-lateral" id="menu-lateral">
    <nav aria-label="Secciones del sitio">
      <a class="enlace-menu" href="inicio.html">Inicio</a>
      <a class="enlace-menu" href="anuncios.html">Anuncios</a>
      <a class="enlace-menu" href="tabla.html">Tabla</a>
      <a class="enlace-menu" href="foro.html" aria-current="page">Foro</a>
      <a class="enlace-menu" href="clase.html">Clase</a>
      <a class="enlace-menu" href="tienda.html">Tienda</a>
    </nav>
    <div class="pie-menu">
      <img src="img/libros-telurio.png" alt="">
    </div>
  </aside>

  <!-- =========================== CONTENIDO ============================== -->
  <main class="contenido">

    <section class="cinta-seccion">
      <div>
        <h1>Foro de la clase</h1>
        <p>Compartí ideas, resolvé dudas y participá de la comunidad.</p>
      </div>
      <img class="mascota-cinta" src="img/einstein.png" alt="">
    </section>

    <div class="cabeza-foro">
      <h2>Foro comunitario</h2>
      <button class="btn" type="button" id="boton-nuevo-tema">＋ Nuevo tema</button>
    </div>

    <!-- ================== FORMULARIO PARA CREAR UN TEMA ==================
         id="formulario-tema" → punto de conexión con POST /api/foro/temas
         ================================================================== -->
    <form class="formulario-tema tarjeta" id="formulario-tema">
      <div class="campo">
        <label for="campo-titulo-tema">Título del tema</label>
        <input type="text" id="campo-titulo-tema" name="titulo"
               maxlength="80" placeholder="Ej.: Dudas sobre la clase tres" required>
      </div>

      <div class="campo">
        <label for="campo-detalle-tema">¿Qué querés preguntar o compartir?</label>
        <textarea id="campo-detalle-tema" name="detalle" maxlength="500"
                  placeholder="Contale a la clase tu duda o idea..." required></textarea>
      </div>

      <div class="acciones-formulario">
        <button class="btn" type="submit" id="boton-publicar-tema">Publicar tema</button>
        <button class="btn btn-fantasma" type="button" id="boton-cancelar-tema">Cancelar</button>
      </div>
    </form>

    <!-- Tabla de temas (la pinta js/foro.js) -->
    <table class="tabla-foro" aria-label="Temas del foro">
      <thead>
        <tr>
          <th scope="col">Tema</th>
          <th scope="col">Autor</th>
          <th scope="col">Respuestas</th>
        </tr>
      </thead>
      <tbody id="cuerpo-temas"></tbody>
    </table>

  </main>

  <script src="js/estado.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/principal.js"></script>
  <script src="js/foro.js"></script>
</body>
</html>
